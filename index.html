<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Duel LP</title>
  <meta name="theme-color" content="#14110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duel LP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="undo" class="tool" type="button" disabled>↶ Annulla</button>
      <button id="history" class="tool" type="button">Cronologia</button>
      <button id="new-duel" class="tool" type="button">Nuovo duello</button>
    </header>

    <section class="players" aria-label="Giocatori">
      <article class="player" data-player="0">
        <input class="name" aria-label="Nome giocatore 1" maxlength="14" autocomplete="off" spellcheck="false">
        <output class="lp">8000</output>
        <span class="preview" aria-live="polite"></span>
      </article>
      <article class="player" data-player="1">
        <input class="name" aria-label="Nome giocatore 2" maxlength="14" autocomplete="off" spellcheck="false">
        <output class="lp">8000</output>
        <span class="preview" aria-live="polite"></span>
      </article>
    </section>

    <section class="extras" aria-label="Strumenti del duello">
      <button id="halve" class="tool" type="button">½ LP</button>
      <button id="coin" class="tool" type="button">Moneta</button>
      <button id="dice" class="tool" type="button">Dado</button>
    </section>

    <section class="display" aria-live="polite">
      <span id="expr" class="expr"></span>
      <span id="value" class="value">0</span>
      <button id="clear" class="clear" type="button" aria-label="Cancella il numero">C</button>
    </section>

    <section class="keypad" aria-label="Tastierino">
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="÷" class="op" aria-label="diviso">÷</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="×" class="op" aria-label="per">×</button>
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="−" class="op" aria-label="meno">−</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="00">00</button>
      <button type="button" data-key="back" class="op" aria-label="Cancella una cifra">⌫</button>
      <button type="button" data-key="+" class="op" aria-label="più">+</button>
    </section>

    <section class="actions">
      <button id="damage" class="action damage" type="button" disabled>− Danno</button>
      <button id="heal" class="action heal" type="button" disabled>+ Cura</button>
    </section>
  </main>

  <dialog id="dialog">
    <div id="dialog-body"></div>
    <div id="dialog-buttons" class="dialog-buttons"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
