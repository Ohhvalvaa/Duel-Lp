<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="p" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <radialGradient id="v" cx="50%" cy="50%" r="70%">
      <stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
  </defs>
  <rect width="1800" height="900" fill="#0a0a0a"/>
